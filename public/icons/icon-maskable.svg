<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#93c5fd"/>
      <stop offset="50%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="milk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
  </defs>
  <!-- 完整填充背景（maskable 图标需要填满） -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- 柔光效果 -->
  <ellipse cx="200" cy="160" rx="160" ry="100" fill="white" opacity="0.06"/>
  <!-- 奶瓶（居中在安全区域内，安全区域为中心80%即 ~51-461） -->
  <rect x="196" y="180" width="120" height="168" rx="24" ry="24" fill="white" opacity="0.95"/>
  <rect x="218" y="142" width="76" height="44" rx="12" ry="12" fill="white" opacity="0.95"/>
  <path d="M238 142 Q256 110 274 142" fill="white" opacity="0.95" stroke="white" stroke-width="3"/>
  <!-- 奶液 -->
  <rect x="202" y="264" width="108" height="78" rx="18" ry="18" fill="url(#milk)" opacity="0.5"/>
  <!-- 刻度线 -->
  <line x1="202" y1="222" x2="228" y2="222" stroke="#93c5fd" stroke-width="4" stroke-linecap="round"/>
  <line x1="202" y1="244" x2="218" y2="244" stroke="#93c5fd" stroke-width="4" stroke-linecap="round"/>
  <line x1="202" y1="266" x2="228" y2="266" stroke="#93c5fd" stroke-width="4" stroke-linecap="round"/>
  <line x1="202" y1="288" x2="218" y2="288" stroke="#93c5fd" stroke-width="4" stroke-linecap="round"/>
  <!-- 心形装饰 -->
  <path d="M340 340 C340 332 352 326 357 332 C362 326 374 332 374 340 C374 350 357 360 357 360 C357 360 340 350 340 340Z" fill="#f9a8d4" opacity="0.7"/>
</svg>
