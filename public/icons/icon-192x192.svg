<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#93c5fd"/>
      <stop offset="50%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="milk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e40af" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- 背景圆角矩形 -->
  <rect width="192" height="192" rx="42" ry="42" fill="url(#bg)"/>
  <!-- 柔光效果 -->
  <ellipse cx="80" cy="60" rx="60" ry="40" fill="white" opacity="0.08"/>
  <!-- 奶瓶组 -->
  <g filter="url(#shadow)">
    <!-- 奶瓶主体 -->
    <rect x="66" y="62" width="60" height="82" rx="14" ry="14" fill="white" opacity="0.95"/>
    <!-- 奶瓶瓶口 -->
    <rect x="76" y="44" width="40" height="22" rx="7" ry="7" fill="white" opacity="0.95"/>
    <!-- 奶嘴 -->
    <path d="M88 44 Q96 26 104 44" fill="white" opacity="0.95" stroke="white" stroke-width="2"/>
  </g>
  <!-- 奶液 -->
  <rect x="70" y="98" width="52" height="42" rx="10" ry="10" fill="url(#milk)" opacity="0.5"/>
  <!-- 刻度线 -->
  <line x1="70" y1="80" x2="84" y2="80" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
  <line x1="70" y1="90" x2="80" y2="90" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
  <line x1="70" y1="100" x2="84" y2="100" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
  <line x1="70" y1="110" x2="80" y2="110" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
  <!-- 心形装饰 -->
  <path d="M134 146 C134 141.5 140 137.5 143.5 141.5 C147 137.5 153 141.5 153 146 C153 152.5 143.5 159 143.5 159 C143.5 159 134 152.5 134 146Z" fill="#f9a8d4" opacity="0.85"/>
  <!-- 小星星装饰 -->
  <circle cx="48" cy="48" r="3" fill="white" opacity="0.4"/>
  <circle cx="152" cy="56" r="2" fill="white" opacity="0.3"/>
  <circle cx="44" cy="140" r="2.5" fill="white" opacity="0.25"/>
</svg>
