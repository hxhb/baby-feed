services:
  baby-feed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: baby-feed
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/baby-feed.db
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?请在 .env 文件中设置 NEXTAUTH_SECRET}
      # ⚠️ NEXTAUTH_URL 必须设置为你实际访问的地址！
      # 如果通过 IP 访问：http://192.168.x.x:3000
      # 如果通过域名访问：https://yourdomain.com
      # 如果仅本机访问：http://localhost:3000
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
    volumes:
      - ${DATA_PATH:-./data}:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
